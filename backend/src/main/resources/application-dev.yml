# Dev defaults; automated tests use isolated profiles.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/loopcraft_local}
    username: ${DB_USER:loopcraft}
    password: ${DB_PASSWORD:loopcraft_local_only}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

server:
  address: 127.0.0.1
