# Explicit opt-in. The SDK appends /chat/completions to a base URL ending in /v1.
spring:
  ai:
    model:
      chat: openai
    openai:
      chat:
        api-key: ${LLM_API_KEY}
        base-url: ${LLM_BASE_URL}
        model: ${LLM_MODEL}
        timeout: ${LLM_TIMEOUT:45s}
        max-retries: 0
        max-tokens: ${LLM_MAX_TOKENS:2048}
