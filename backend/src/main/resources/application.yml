spring:
  application:
    name: loopcraft
  profiles:
    default: dev
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true

loopcraft:
  agent:
    model-request-timeout: ${AGENT_MODEL_REQUEST_TIMEOUT:45s}
    tool-timeout: ${AGENT_TOOL_TIMEOUT:15s}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:32}
    max-tool-result-chars: ${AGENT_MAX_TOOL_RESULT_CHARS:8000}
    events-stream-max-len: ${AGENT_EVENTS_STREAM_MAX_LEN:1000}
    events-stream-ttl: ${AGENT_EVENTS_STREAM_TTL:10m}
  skill:
    bucket: ${SKILL_BUCKET:loopcraft-skills}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:http://127.0.0.1:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:20MB}
    connect-timeout: ${STORAGE_CONNECT_TIMEOUT:3s}
    read-timeout: ${STORAGE_READ_TIMEOUT:30s}
    request-timeout: ${STORAGE_REQUEST_TIMEOUT:60s}
    download-link-ttl: ${STORAGE_DOWNLOAD_LINK_TTL:5m}
  redis:
    enabled: ${REDIS_ENABLED:false}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:16379}
    password: ${REDIS_PASSWORD:}
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
    timeout: ${REDIS_TIMEOUT:3s}
  llm:
    encryption-key: ${LLM_ENCRYPTION_KEY:}
    discovery-allowed-internal-hosts: ${LLM_DISCOVERY_ALLOWED_INTERNAL_HOSTS:}
  identity:
    login-protection:
      account-failures: 5
      ip-attempts: 30
      window: 15m
      max-entries: 10000
    bootstrap:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.github.chalmery.loopcraft: ${LOG_LEVEL_APP:INFO}
    # Validation exception messages can include rejected request-body values.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
  file:
    name: ${LOG_DIR:./logs}/loopcraft.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/archive/loopcraft.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
      clean-history-on-start: true
