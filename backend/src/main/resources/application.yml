spring:
  application:
    name: loopcraft
  profiles:
    default: dev
  sql:
    init:
      mode: never
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true

loopcraft:
  llm:
    encryption-key: ${LLM_ENCRYPTION_KEY:}
    discovery-allowed-internal-hosts: ${LLM_DISCOVERY_ALLOWED_INTERNAL_HOSTS:}
  identity:
    login-protection:
      account-failures: 5
      ip-attempts: 30
      window: 15m
      max-entries: 10000
    bootstrap:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.github.chalmery.loopcraft: ${LOG_LEVEL_APP:INFO}
    # Validation exception messages can include rejected request-body values.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
  file:
    name: ${LOG_DIR:./logs}/loopcraft.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/archive/loopcraft.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
      clean-history-on-start: true
